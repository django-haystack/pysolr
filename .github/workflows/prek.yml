name: prek
permissions:
  contents: read
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly on Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Run hooks
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0

  update:
    name: Update hooks (7-day cooldown)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Push to the `update-pre-commit-hooks` branch
      pull-requests: write  # Open a pull request to propose revisions.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        with:
          install-only: true

      # `--cooldown-days 7` keeps hook releases newer than 7 days out of the
      # update, to blunt supply-chain attacks that publish and yank a bad tag.
      - name: Update hook revisions
        run: prek update --cooldown-days 7

      # Push the refreshed config and open (or refresh) the PR using the
      # preinstalled `gh` CLI, so no third-party action needs write access.
      - name: Open pull request for hook updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- .pre-commit-config.yaml; then
            echo "No hook updates available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          # https://api.github.com/users/github-actions%5Bbot%5D
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create update-pre-commit-hooks
          git add .pre-commit-config.yaml
          git commit --message "Update pre-commit hooks"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:update-pre-commit-hooks
          if [ -z "$(gh pr list --head update-pre-commit-hooks --state open --json number --jq '.[].number')" ]; then
            gh pr create --base master --head update-pre-commit-hooks \
              --title "Update pre-commit hooks" \
              --body "Automated update generated by \`prek update --cooldown-days 7\`."
          else
            echo "Pull request already open; pushed the refreshed branch."
          fi
